services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: shms_user
      POSTGRES_PASSWORD: shms_dev_password
      POSTGRES_DB: shms_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shms_user -d shms_dev"]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  pgdata:
