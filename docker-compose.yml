services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: shms_user
      POSTGRES_PASSWORD: shms_dev_password
      POSTGRES_DB: shms_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shms_user -d shms_dev"]
      interval: 5s
      timeout: 3s
      retries: 5
  # Development mail catcher (IR-05): the API's SMTP default. Every message is
  # kept here and none is delivered. Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  pgdata:
